<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lodestar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%231f2320'/%3E%3Ctext%20x='16'%20y='24'%20font-size='22'%20text-anchor='middle'%20fill='%237FA6C6'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
<style>
  :root{ color-scheme:dark; --bg:#1f2320; --card:#2b2f2a; --soft:#262a25; --line:#3d423a;
    --ink:#f0eee8; --muted:#a4a49b; --muted2:#7c7e75; --accent:#7FA6C6; --track:#3a3f37; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink); font-weight:400; -webkit-font-smoothing:antialiased; }
  .app{ max-width:1400px; margin:0 auto; padding:22px 40px 80px; }
  header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .brand{ font-size:19px; font-weight:500; letter-spacing:.04em; display:flex; align-items:center; gap:8px; }
  .brand .star{ color:var(--accent); animation:twinkle 3.2s ease-in-out infinite; }
  @keyframes twinkle{ 0%,100%{opacity:.5} 50%{opacity:1} }
  .tools{ display:flex; gap:12px; }
  .tools button{ border:none; background:none; color:var(--muted); font-size:12.5px; cursor:pointer; padding:2px; }
  .tools button:hover{ color:var(--ink); }
  #dayDoneBtn.planning{ color:var(--accent); font-weight:500; }
  .tabs{ display:flex; gap:8px; border-bottom:1px solid var(--line); margin-bottom:24px; align-items:flex-end; }
  .tab{ padding:8px 14px; cursor:pointer; font-size:14.5px; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-1px; border-radius:8px 8px 0 0; }
  .tab:hover{ color:var(--ink); }
  .tab.active{ color:var(--ink); border-bottom-color:var(--tabc,var(--ink)); background:var(--tabbg,transparent); font-weight:500; }
  .dtabs{ display:flex; gap:20px; margin-bottom:24px; }
  .dtab{ background:none; border:none; padding:0 0 8px; font-size:14px; color:var(--muted); border-bottom:2px solid transparent; cursor:pointer; }
  .dtab.active{ color:var(--ink); border-bottom-color:var(--accent); font-weight:500; }
  .muted{ color:var(--muted); font-size:13px; } .empty{ color:var(--muted2); font-size:13.5px; padding:14px 0; }
  input,select{ font:inherit; font-size:13px; border:1px solid var(--line); border-radius:8px; padding:6px 8px; background:var(--card); color:var(--ink); }
  input:focus,select:focus{ outline:none; border-color:var(--accent); }
  input[type=checkbox]{ width:16px; height:16px; accent-color:var(--accent); cursor:pointer; }
  input[type=date]{ color-scheme:inherit; }
  .track{ height:6px; border-radius:999px; background:var(--track); overflow:hidden; }
  .track.big{ height:13px; } .track>span{ display:block; height:100%; border-radius:999px; background:var(--accent); transition:width .5s ease; }
  .btn{ border:1px solid var(--line); background:var(--card); border-radius:8px; padding:6px 12px; font-size:13px; cursor:pointer; color:var(--ink); }
  .btn:hover{ border-color:var(--accent); }
  .del{ background:none; border:none; color:var(--muted2); cursor:pointer; font-size:14px; line-height:1; padding:1px 4px; }
  .del:hover{ color:#c99; }
  [contenteditable]{ cursor:text; } [contenteditable]:hover{ color:var(--accent); } [contenteditable]:focus{ outline:none; box-shadow:0 1px 0 var(--accent); }
  .theme{ display:flex; align-items:center; gap:6px; color:var(--muted2); font-size:13px; }
  .theme input[type=range]{ width:74px; }

  .hero{ margin-bottom:26px; max-width:760px; border:1px solid var(--line); border-radius:14px; padding:18px 20px; }
  .herohead{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; }
  .htitle{ font-size:17px; font-weight:500; } .hpct{ font-size:23px; font-weight:500; }
  .hsub{ font-size:12.5px; color:var(--muted); margin-top:9px; display:flex; align-items:center; gap:10px; }
  .hsub input[type=date]{ font-size:11.5px; padding:3px 6px; }
  .pillar{ margin-bottom:8px; }
  .phead{ display:flex; align-items:center; gap:14px; cursor:pointer; padding:13px 16px; border-radius:11px; }
  .chev{ color:var(--ink); font-size:14px; width:16px; }
  .pdot{ width:12px; height:12px; border-radius:50%; flex:none; }
  .pname{ font-size:15px; min-width:150px; }
  .pbarwrap{ flex:1; max-width:420px; } .pbarwrap .track{ height:10px; }
  .ppct{ color:var(--muted); font-size:13px; width:42px; text-align:right; margin-left:auto; }
  .board{ display:flex; gap:12px; padding:2px 0 20px 28px; overflow-x:auto; align-items:flex-start; }
  .board.flat{ padding-left:0; }
  .col{ background:var(--soft); border-radius:12px; padding:12px; min-width:0; flex:1 1 0; }
  .col.cc{ flex:0 0 44px; padding:14px 4px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .ccl{ writing-mode:vertical-rl; font-size:12px; color:var(--muted); white-space:nowrap; letter-spacing:.03em; }
  .col.drag{ box-shadow:inset 0 0 0 2px var(--accent); }
  .col h5{ font-size:11px; font-weight:500; letter-spacing:.04em; color:var(--muted); margin:2px 4px 10px; display:flex; justify-content:space-between; text-transform:lowercase; }
  .todayclear{ color:var(--accent); font-size:12.5px; padding:6px 4px; }
  .kcard{ background:var(--card); border:1px solid var(--line); border-radius:9px; padding:8px 10px; margin-bottom:8px; cursor:grab; }
  .crumb{ font-size:10.5px; color:var(--muted2); margin-bottom:5px; }
  .kct{ font-size:10.5px; color:var(--muted2); }
  .tnode{ display:flex; align-items:center; gap:7px; padding:3px 0; font-size:13px; }
  .tnode .tnm{ flex:1; cursor:pointer; } .tnode .tnm.done{ text-decoration:line-through; color:var(--muted2); }
  .tnode.dropbefore{ box-shadow:inset 0 2px 0 0 var(--accent); } .tnode.dropchild{ background:rgba(127,166,198,.16); border-radius:6px; }
  .tchev{ color:var(--ink); font-size:20px; width:20px; text-align:center; cursor:pointer; user-select:none; }
  .odue{ width:6px; height:6px; border-radius:50%; background:#cf8f8f; display:inline-block; flex:none; }
  .subadd{ width:100%; margin-top:4px; font-size:11.5px; border:none; border-radius:0; padding:3px 0 0; background:none; }
  .subadd:focus{ box-shadow:none; }
  .cadd{ width:100%; margin-top:4px; font-size:12px; border:none; border-top:1px solid var(--line); border-radius:0; padding:7px 2px 2px; background:none; }
  .cadd:focus{ box-shadow:none; }
  .addpillar{ display:flex; gap:8px; align-items:center; margin-top:8px; padding-top:14px; border-top:1px solid var(--line); }
  .paddrow{ display:block; margin:8px 0 10px 28px; width:300px; max-width:90%; font-size:12px; padding:7px 10px; }
  .identity{ font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:6px; margin:2px 0 8px 28px; font-style:italic; }
  .identity .idlabel{ opacity:.85; } .identity .idtext{ color:var(--ink); font-style:normal; }
  .identity .votes{ margin-left:12px; font-style:normal; color:var(--accent); font-size:11.5px; }
  .ticker{ position:relative; display:inline-block; height:1.3em; min-width:130px; font-style:normal; }
  .ticker span{ position:absolute; left:0; white-space:nowrap; opacity:0; color:var(--accent); font-size:12px; animation:tick 16s infinite; }
  .ticker span:nth-child(1){ animation-delay:0s; } .ticker span:nth-child(2){ animation-delay:4s; }
  .ticker span:nth-child(3){ animation-delay:8s; } .ticker span:nth-child(4){ animation-delay:12s; }
  @keyframes tick{ 0%{opacity:0;transform:translateY(3px);} 3%{opacity:.9;transform:translateY(0);} 22%{opacity:.9;transform:translateY(0);} 25%{opacity:0;transform:translateY(-3px);} 100%{opacity:0;} }
  .pident{ display:flex; align-items:center; gap:12px; margin-left:4px; }
  .dayid{ font-size:14.5px; color:var(--accent); white-space:nowrap; animation:breathe 5s ease-in-out infinite; }
  .pvotes{ font-size:12.5px; color:var(--accent); white-space:nowrap; }
  @keyframes breathe{ 0%,100%{opacity:.6;} 50%{opacity:1;} }
  .calwrap{ display:flex; gap:28px; flex-wrap:wrap; }
  .caltl{ position:relative; flex:1; min-width:320px; max-width:560px; margin-left:52px; border-left:1px solid var(--line); }
  .chline{ position:absolute; left:0; right:0; border-top:1px solid var(--line); }
  .chlab{ position:absolute; left:-54px; font-size:12.5px; font-weight:500; color:var(--muted); width:46px; text-align:right; z-index:9; background:var(--bg); padding:1px 2px 1px 0; border-radius:3px; }
  .cblock{ position:absolute; left:6px; right:8px; border-radius:7px; padding:3px 8px; overflow:hidden; cursor:pointer; z-index:1; }
  .cblock:hover{ z-index:5; }
  .cblock.done{ opacity:.55; }
  .cbname{ font-size:14px; color:var(--ink); font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cbtime{ font-size:12.5px; color:var(--ink); opacity:.82; }
  /* short blocks (<=30 min) put name + time on one line so the box never has to
     grow past its own duration and cover the block underneath it */
  .cblock.short{ display:flex; align-items:center; gap:8px; padding:0 46px 0 8px; }
  .cblock.short .cbname{ font-size:13px; line-height:1.1; min-width:0; }
  .cblock.short .cbtime{ font-size:12px; line-height:1.1; white-space:nowrap; flex:none; }
  .cblock.short .cbx{ top:50%; transform:translateY(-50%); line-height:1; }
  .cblock.short .cbplay{ top:50%; transform:translateY(-50%); line-height:1; }
  .cblock.short .cbresize{ height:5px; }
  .cbx{ position:absolute; top:1px; right:5px; background:none; border:none; color:var(--muted); cursor:pointer; font-size:18px; line-height:1; padding:0; }
  .cbx:hover{ color:var(--ink); }
  .cbresize{ position:absolute; left:0; right:0; bottom:0; height:8px; cursor:ns-resize; border-radius:0 0 7px 7px; z-index:6; }
  .cbresize:hover{ background:rgba(127,127,127,.28); }
  .cnow{ position:absolute; left:-54px; right:0; border-top:2px solid #d9754f; z-index:7; }
  .calside{ width:340px; } .calh4{ font-size:12px; color:var(--muted); font-weight:500; margin:0 0 8px; text-transform:lowercase; letter-spacing:.04em; }
  .addblock .fld{ width:100%; } .timerow{ display:flex; align-items:center; gap:6px; margin-top:12px; flex-wrap:wrap; } .timerow select{ padding:6px 6px; } .tlab{ font-size:12px; color:var(--muted); } .tcolon{ color:var(--muted); }
  .ibrow{ display:flex; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid var(--line); } .ibrow:last-child{ border-bottom:none; } .ibtext{ flex:1; font-size:13.5px; }
  .unrow{ display:flex; align-items:center; gap:8px; margin-bottom:8px; } .undot{ width:9px; height:9px; border-radius:50%; flex:none; } .unname{ flex:1; font-size:13px; }
  .cbplay{ position:absolute; top:3px; right:26px; background:none; border:none; color:var(--muted); cursor:pointer; font-size:13px; line-height:1; padding:0; } .cbplay:hover{ color:var(--accent); }
  .mitstar{ color:#e0b13a; margin-right:3px; } .etag{ font-size:11px; margin-left:6px; } .etag.deep{ color:var(--accent); } .etag.shallow{ color:var(--muted2); }
  .insrow{ display:flex; align-items:center; gap:12px; margin-bottom:9px; } .inslab{ width:160px; font-size:13px; }
  .insbar{ flex:1; height:9px; border-radius:999px; background:var(--track); overflow:hidden; max-width:340px; } .insbar>span{ display:block; height:100%; border-radius:999px; }
  .insval{ font-size:12px; color:var(--muted); width:70px; text-align:right; }
  .insweek{ display:flex; gap:16px; align-items:flex-end; height:92px; } .insday{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .insdbar{ width:26px; background:var(--accent); border-radius:5px 5px 0 0; min-height:2px; } .insdl{ font-size:10px; color:var(--muted2); }

  .dlgroup{ margin-bottom:22px; } .dlgroup h4{ font-size:12px; color:var(--muted); font-weight:500; margin:0 0 8px; text-transform:lowercase; letter-spacing:.04em; }
  .dlrow{ display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
  .dlrow:last-child{ border-bottom:none; } .dlname{ flex:1; font-size:14px; cursor:pointer; } .dlpill{ font-size:11.5px; color:var(--muted); } .dldue{ font-size:12px; color:var(--muted); width:150px; text-align:right; }

  .habit{ padding:14px 0; border-bottom:1px solid var(--line); } .habit:last-child{ border-bottom:none; }
  .htop{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .hname{ font-size:14.5px; } .streak{ font-size:12px; color:var(--muted); }
  .days{ display:flex; gap:5px; margin-top:12px; flex-wrap:wrap; }
  .day{ width:32px; text-align:center; font-size:10px; color:var(--muted2); }
  .day .dot{ width:24px; height:24px; margin:3px auto 0; border-radius:7px; border:1px solid var(--line); background:var(--card); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff; transition:background .2s; }
  .day.today .dot{ box-shadow:0 0 0 2px var(--track); }
  .addform{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:16px; }
  .addform input[type=text]{ flex:1; min-width:130px; }
  .gsel{ font-size:12px; color:var(--muted); }

  .modal{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); align-items:flex-start; justify-content:center; z-index:50; padding:8vh 16px; }
  .mpanel{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px 22px; width:440px; max-width:94vw; }
  .mrow{ display:flex; align-items:center; gap:10px; }
  .mtitle{ font-size:16px; font-weight:500; width:100%; border:none; background:none; color:var(--ink); padding:5px 0; }
  .mtitle:focus{ outline:none; box-shadow:0 1px 0 var(--accent); }
  .mlab{ display:block; font-size:11px; color:var(--muted); margin:16px 0 5px; letter-spacing:.04em; }
  .mpanel input[type=date], .mpanel select, .mpanel textarea{ width:100%; }
  .mpanel textarea{ resize:vertical; font-family:inherit; line-height:1.5; }
  .reminder{ display:none; position:fixed; top:14px; left:50%; transform:translateX(-50%); background:var(--card); border:1px solid var(--accent); border-radius:11px; padding:12px 16px; z-index:60; box-shadow:0 8px 28px rgba(0,0,0,.45); font-size:13.5px; align-items:center; gap:12px; max-width:92vw; }
  .reminder.show{ display:flex; }
  .sky{ position:relative; height:14px; overflow:hidden; margin-bottom:4px; }
  .sky span{ position:absolute; top:2px; color:var(--accent); font-size:10px; }
  .sky .s1{ opacity:.55; animation:drift 28s linear infinite; }
  .sky .s2{ opacity:.35; font-size:8px; top:6px; animation:drift 44s linear infinite; animation-delay:-20s; }
  .sky .s3{ opacity:.4; top:0; animation:drift 36s linear infinite; animation-delay:-12s; }
  @keyframes drift{ from{ left:-3%; } to{ left:103%; } }
  .cals{ display:flex; gap:22px; flex-wrap:wrap; }
  .cal{ flex:1; min-width:300px; }
  .calh{ font-size:13px; color:var(--muted); margin:4px 0 10px; }
  .cgrid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .cdow{ font-size:10px; color:var(--muted2); text-align:center; padding-bottom:2px; }
  .ccell{ min-height:58px; border:1px solid var(--line); border-radius:7px; padding:3px; background:var(--soft); }
  .ccell.empty{ background:none; border:none; }
  .ccell.ctoday{ box-shadow:inset 0 0 0 1px var(--accent); }
  .cnum{ font-size:10.5px; color:var(--muted); margin-bottom:2px; }
  .cchip{ font-size:10px; color:#20231f; border-radius:4px; padding:1px 4px; margin-bottom:2px; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .colgrp{ font-size:10.5px; color:var(--muted); display:flex; align-items:center; gap:6px; margin:12px 2px 5px; text-transform:uppercase; letter-spacing:.03em; }
  .colgrp:first-child{ margin-top:2px; }
  .hcals{ display:flex; gap:22px; flex-wrap:wrap; margin-top:12px; }
  .hcalh{ font-size:11px; color:var(--muted); margin-bottom:6px; }
  .hgrid{ display:grid; grid-template-columns:repeat(7,24px); gap:4px; }
  .hdow{ font-size:9px; color:var(--muted2); text-align:center; }
  .hcell{ width:24px; height:24px; border-radius:6px; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:9.5px; color:var(--muted); cursor:pointer; }
  .hcell.on{ color:#20231f; font-weight:500; }
  .hcell.empty{ border:none; }
  .hcell.htoday{ box-shadow:0 0 0 2px var(--track); }
  .hcell.fut{ opacity:.3; cursor:default; }
  .tpill{ position:fixed; right:20px; bottom:20px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:9px 15px; font-size:13.5px; cursor:pointer; z-index:55; box-shadow:0 6px 20px rgba(0,0,0,.3); display:flex; gap:7px; align-items:center; color:var(--ink); }
  .tpill.run{ border-color:var(--accent); color:var(--accent); }
  .tpanel{ display:none; position:fixed; right:20px; bottom:66px; width:250px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; z-index:56; box-shadow:0 12px 34px rgba(0,0,0,.45); }
  .tpanel.open{ display:block; }
  .tph{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .tmodes{ display:flex; gap:4px; }
  .tmode{ font-size:11.5px; border:1px solid var(--line); background:none; color:var(--muted); border-radius:7px; padding:4px 9px; cursor:pointer; }
  .tmode.active{ background:var(--accent); color:#20231f; border-color:var(--accent); }
  .tring{ position:relative; width:150px; height:150px; margin:6px auto 12px; }
  .tring svg{ width:150px; height:150px; transform:rotate(-90deg); }
  .tring .tbg{ fill:none; stroke:var(--track); stroke-width:7; }
  .tring .tprog{ fill:none; stroke:var(--accent); stroke-width:7; stroke-linecap:round; transition:stroke-dashoffset 1s linear; }
  .ttime{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:500; font-variant-numeric:tabular-nums; }
  .tphase{ position:absolute; left:0; right:0; bottom:32px; text-align:center; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
  .tctrl{ display:flex; gap:8px; justify-content:center; margin-bottom:6px; }
  .tset{ display:flex; gap:12px; margin-top:10px; justify-content:center; }
  .tset label{ font-size:11px; color:var(--muted); display:flex; align-items:center; gap:5px; }
  .tset input{ width:50px; }
  .ttot{ font-size:11.5px; color:var(--muted); text-align:center; margin-top:12px; }
  #ttask{ width:100%; margin-top:8px; font-size:12px; }
  .tflash{ animation:tflash .6s ease; }
  @keyframes tflash{ 0%,100%{ box-shadow:0 12px 34px rgba(0,0,0,.45);} 50%{ box-shadow:0 0 0 3px var(--accent);} }
</style>
</head>
<body>
<div class="app">
  <div class="sky"><span class="s1">&#10022;</span><span class="s2">&#10022;</span><span class="s3">&middot;</span></div>
  <header>
    <div class="brand"><span class="star">&#10022;</span> Lodestar</div>
    <div class="tools">
      <button id="themeBtn" onclick="toggleTheme()" title="Toggle day / night" style="font-size:15px">&#9790;</button>
      <button onclick="undo()" title="Undo (Ctrl+Z)">&#8630; Undo</button>
      <button onclick="redo()" title="Redo (Ctrl+Shift+Z)">&#8631; Redo</button>
      <button onclick="sweepArchive()" title="Move all completed items into Archive">Archive done</button>
      <button id="dayDoneBtn" onclick="toggleDayDone()" title="Close out today and start planning tomorrow">Done for the day</button>
      <button id="inboxBtn" onclick="openInbox()" title="Quick-capture ideas">Inbox</button>
      <button onclick="openJournal()" title="Daily journal">Journal</button>
      <button onclick="exportData()">Export</button>
      <button onclick="document.getElementById('imp').click()">Import</button>
      <input id="imp" type="file" accept="application/json" style="display:none" onchange="importData(this)">
      <button onclick="resetData()">Reset</button>
    </div>
  </header>
  <nav class="tabs" id="nav"></nav>
  <div id="content"></div>
</div>

<div id="reminder" class="reminder">
  <span>Planning time — export today and share it with Claude.</span>
  <button class="btn" onclick="exportData();document.getElementById('reminder').classList.remove('show')">Export now</button>
  <button class="del" onclick="document.getElementById('reminder').classList.remove('show')">&times;</button>
</div>
<div id="tpill" class="tpill" onclick="timerToggle()">&#9201; <span id="tpillt">Focus</span></div>
<div id="tpanel" class="tpanel">
  <div class="tph"><div class="tmodes"><button id="tm-pomodoro" class="tmode active" onclick="timerMode('pomodoro')">Pomodoro</button><button id="tm-flow" class="tmode" onclick="timerMode('flow')">Flow</button></div><button class="del" onclick="timerToggle()">&times;</button></div>
  <div class="tring"><svg viewBox="0 0 120 120"><circle class="tbg" cx="60" cy="60" r="52"/><circle id="tprog" class="tprog" cx="60" cy="60" r="52"/></svg><div id="ttime" class="ttime">25:00</div><div id="tphase" class="tphase">work</div></div>
  <div class="tctrl"><button id="tstart" class="btn" onclick="timerStartPause()">Start</button><button id="tsecond" class="btn" onclick="timerSecond()">Reset</button></div>
  <select id="ttask"></select>
  <div id="tsettings" class="tset"><label>Work <input id="twork" type="number" min="1" value="25"></label><label>Break <input id="tbreak" type="number" min="1" value="5"></label></div>
  <div id="ttotal" class="ttot"></div>
</div>

<div id="inbox" class="modal" onclick="if(event.target===this)closeInbox()">
  <div class="mpanel">
    <div class="mrow"><input id="capIn" class="mtitle" placeholder="Capture a thought… (Enter)" onkeydown="if(event.key==='Enter')addCapture()"><button class="del" onclick="closeInbox()">&times;</button></div>
    <div id="inboxList" style="margin-top:14px"></div>
  </div>
</div>
<div id="journal" class="modal" onclick="if(event.target===this)closeJournal()">
  <div class="mpanel">
    <div class="mrow"><span class="mtitle">Journal · <span id="jDate"></span></span><button class="del" onclick="closeJournal()">&times;</button></div>
    <label class="mlab">Today</label><textarea id="jText" rows="7" oninput="jEdit(this.value)" style="width:100%"></textarea>
    <div class="muted" style="margin-top:10px;font-style:italic">What did today say about who you're becoming?</div>
  </div>
</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeTask()">
  <div class="mpanel">
    <div class="mrow"><input id="mName" class="mtitle" placeholder="Task name" oninput="mEdit('name',this.value)"><button class="del" onclick="closeTask()">&times;</button></div>
    <label class="mlab">Deadline</label><input id="mDue" type="date" oninput="mEdit('due',this.value)">
    <label class="mlab">Priority</label><select id="mPrio" onchange="mEdit('prio',this.value)"><option value="">None</option><option>High</option><option>Medium</option><option>Low</option></select>
    <div id="mPillarRow"><label class="mlab">Pillar</label><select id="mPillar" onchange="mSetPillar(this.value)"></select></div>
    <div class="mrow" style="gap:18px;margin-top:4px"><label style="flex:1"><span class="mlab">Energy</span><select id="mEnergy" onchange="mEdit('energy',this.value)"><option value="">—</option><option value="deep">Deep focus</option><option value="shallow">Shallow</option></select></label><label style="display:flex;align-items:center;gap:6px;font-size:13px;align-self:flex-end;padding-bottom:6px"><input type="checkbox" id="mMit" onchange="mToggleMit(this.checked)"> ★ Today's priority</label></div>
    <label class="mlab">Time block (today)</label>
    <div class="mrow" style="gap:6px;align-items:center;font-size:13px"><select id="mBSH" onchange="mBlockChange()"></select><span class="tcolon">:</span><select id="mBSM" onchange="mBlockChange()"></select><span style="color:var(--muted);margin:0 4px">to</span><select id="mBEH" onchange="mBlockChange()"></select><span class="tcolon">:</span><select id="mBEM" onchange="mBlockChange()"></select><button class="del" style="margin-left:auto" onclick="mClearBlock()" title="Remove from calendar">clear</button></div>
    <button class="btn" style="margin-top:12px;width:100%" onclick="startTimerFor(mid);closeTask()">▶ Start focus timer on this task</button>
    <label class="mlab">Notes</label><textarea id="mNotes" rows="4" placeholder="Anything else…" oninput="mEdit('notes',this.value)"></textarea>
    <label class="mlab">Time logged</label><div id="mFocus" class="muted"></div>
  </div>
</div>

<script>
const KEY="myplanner.v3";
let state=null, currentBoard=null, view="overview", dragId=null, mid=null;
let texpanded=new Set();
let colState=JSON.parse(localStorage.getItem("myplanner.colstate")||"{}");
let history=[], hi=-1;
const THEMES={
 dark:{bg:"#1f2320",card:"#2b2f2a",soft:"#262a25",line:"#3d423a",ink:"#f0eee8",muted:"#a4a49b",muted2:"#7c7e75",track:"#3a3f37"},
 light:{bg:"#f2efe7",card:"#fffdf9",soft:"#e9e4d8",line:"#e2dccd",ink:"#38352d",muted:"#7a776c",muted2:"#aca897",track:"#e6dfd0"}
};
let themeBg="#1f2320", themeName="dark";
function applyThemeVars(name){ const p=THEMES[name]||THEMES.dark; const r=document.documentElement; for(const k in p) r.style.setProperty("--"+k,p[k]); r.style.colorScheme = name==="dark"?"dark":"light"; themeBg=p.bg; themeName=name; localStorage.setItem("myplanner.theme",name); }
function setTheme(name){ applyThemeVars(name); render(); const b=document.getElementById("themeBtn"); if(b) b.textContent = themeName==="dark"?"☾":"☀"; }
function toggleTheme(){ setTheme(themeName==="dark"?"light":"dark"); }
const uid=()=>Math.random().toString(36).slice(2,9);
const COLS=[["someday","Total Work"],["quarter","3 Months"],["month","This Month"],["week","This Week"],["today","Today"],["done","Archive"]];
const RANK={someday:0,quarter:1,month:2,week:3,today:4};
const DEFAULT_COLLAPSE=["someday","quarter","done"];
const DOMAIN_PALETTE=["#7FA6C6","#8FBBA1","#D08E68","#A283BC","#C7A24E"];
const PILLAR_COLORS=["#6f9dc4","#cb9a52","#5fae91","#b083c0","#d08a6a","#7fae5f","#c77f9e","#7f8fd0"];

function seed(){
  const gHab={id:uid(),name:"Habilitation",target:"2027-09-30",parentGoalId:null,accent:"#7FA6C6"};
  const gEv={id:uid(),name:"Evergreen",target:"",parentGoalId:null,accent:"#8FBBA1"};
  const gRes={id:uid(),name:"Research papers",target:"",parentGoalId:gHab.id};
  const gTea={id:uid(),name:"Teaching",target:"",parentGoalId:gHab.id};
  const gFun={id:uid(),name:"Funding",target:"",parentGoalId:gHab.id};
  const gThe={id:uid(),name:"Habilitation thesis",target:"",parentGoalId:gHab.id};
  const gGer={id:uid(),name:"German (B1)",target:"",parentGoalId:gEv.id};
  const mk=(name,goalId,bucket)=>({id:uid(),name,goalId,parentId:null,bucket:bucket||"someday",done:false});
  return { goals:[gHab,gEv,gRes,gTea,gFun,gThe,gGer],
    tasks:[ mk("Paper: methods study",gRes.id,"today"), mk("Design new seminar",gTea.id,"week"),
      mk("Scope funding proposal",gFun.id,"today"), mk("Thesis outline",gThe.id,"week"),
      mk("Grammar unit 5",gGer.id,"today") ],
    habits:[ {id:uid(),name:"German",min:30,goalId:gGer.id,done:{}}, {id:uid(),name:"Piano",min:30,goalId:null,done:{}}, {id:uid(),name:"Reading",min:30,goalId:null,done:{}} ] };
}
function blank(){
  return { goals:[], tasks:[], habits:[], sessions:[], events:[], inbox:[], journal:{} };
}
function persist(){ localStorage.setItem(KEY,JSON.stringify(state)); }
function save(){ persist(); history=history.slice(0,hi+1); history.push(JSON.stringify(state)); if(history.length>80) history.shift(); hi=history.length-1; }
function undo(){ if(hi>0){ hi--; state=JSON.parse(history[hi]); persist(); render(); } }
function redo(){ if(hi<history.length-1){ hi++; state=JSON.parse(history[hi]); persist(); render(); } }
function load(){ try{ const s=localStorage.getItem(KEY); state=s?JSON.parse(s):seed(); }catch(e){ state=seed(); } if(!state||!state.tasks) state=seed(); }

function today(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function fmt(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseD(s){ if(!s) return null; const p=s.slice(0,10).split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function diffDays(a,b){ return Math.round((a-b)/86400000); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
let T=today(), TS=fmt(T), MONTH=TS.slice(0,7);
// PD() = the date the Today column and the timeline are planning for. Normally
// the real date; after "Done for the day" it jumps to tomorrow and stays there
// until the clock catches up, at which point checkRollover() clears it.
function nextDay(iso){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+1); return fmt(d); }
function PD(){ return (state.planDate && state.planDate>TS) ? state.planDate : TS; }
function planningAhead(){ return PD()!==TS; }
function dayWord(){ return planningAhead() ? 'Tomorrow' : 'Today'; }
function prettyDate(iso){ const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'}); }
function toggleDayDone(){ if(planningAhead()){ delete state.planDate; } else { state.planDate=nextDay(TS); } save(); render(); }
function checkRollover(){ const ns=fmt(today()); if(ns===TS) return; T=today(); TS=ns; MONTH=TS.slice(0,7); if(state.planDate && state.planDate<=TS){ delete state.planDate; } save(); render(); }
function hx(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function mix(a,b,t){ const A=hx(a),B=hx(b); return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join(''); }
function goalById(id){ return state.goals.find(g=>g.id===id); }
function childrenOf(gid){ return state.goals.filter(g=>g.parentGoalId===gid); }
function domains(){ return state.goals.filter(g=>!g.parentGoalId); }
function isDescendant(candId,ancId){ let g=goalById(candId); while(g&&g.parentGoalId){ if(g.parentGoalId===ancId) return true; g=goalById(g.parentGoalId); } return false; }
function rootOf(gid){ let g=goalById(gid); if(!g) return null; while(g.parentGoalId){ const p=goalById(g.parentGoalId); if(!p) break; g=p; } return g.id; }
function allPillars(){ const out=[]; domains().forEach(d=>childrenOf(d.id).forEach(p=>out.push(p.id))); return out; }
function pillarColor(pid){ const i=allPillars().indexOf(pid); return PILLAR_COLORS[(i<0?0:i)%PILLAR_COLORS.length]; }
function pillarOf(gid){ let g=goalById(gid); if(!g||!g.parentGoalId) return null; while(true){ const p=goalById(g.parentGoalId); if(!p||!p.parentGoalId) return g.id; g=p; } }
function domainAccent(rootId){ const g=goalById(rootId); if(g&&g.accent) return g.accent; const t=domains(); const i=t.findIndex(x=>x.id===rootId); return DOMAIN_PALETTE[(i<0?0:i)%DOMAIN_PALETTE.length]; }
function colorFor(gid){ if(!gid) return '#8a8a82'; const p=pillarOf(gid); if(p) return pillarColor(p); const g=goalById(gid); if(g&&!g.parentGoalId) return domainAccent(g.id); return '#8a8a82'; }
function goalName(id){ const g=goalById(id); return g?g.name:""; }
function subsOf(id){ return state.tasks.filter(t=>t.parentId===id); }
function topTasks(){ return state.tasks.filter(t=>!t.parentId); }
function rootTaskOf(id){ let t=state.tasks.find(x=>x.id===id); while(t&&t.parentId){ const p=state.tasks.find(x=>x.id===t.parentId); if(!p) break; t=p; } return t; }
function isTaskAncestor(a,b){ let t=state.tasks.find(x=>x.id===b); while(t&&t.parentId){ if(t.parentId===a) return true; t=state.tasks.find(x=>x.id===t.parentId); } return false; }
function inColumns(t){ return !t.parentId || (t.bucket!=null && t.bucket!==undefined); }
function effGoalId(t){ if(!t.parentId) return t.goalId; const r=rootTaskOf(t.id); return r?r.goalId:null; }
function domainOf(t){ const eg=effGoalId(t); return eg?rootOf(eg):null; }
function crumb(t){ if(!t.parentId) return ""; const names=[]; let p=state.tasks.find(x=>x.id===t.parentId); let g=0; while(p&&g<12){ names.unshift(p.name); p=p.parentId?state.tasks.find(x=>x.id===p.parentId):null; g++; } return names.length?`<div class="crumb">${names.map(esc).join(" › ")}</div>`:""; }
function tasksUnder(gid){ return topTasks().filter(t=>t.goalId && (t.goalId===gid || isDescendant(t.goalId,gid))); }
function columnItemsUnder(gid){ return state.tasks.filter(t=>inColumns(t)).filter(t=>{ const g=effGoalId(t); return g && (g===gid||isDescendant(g,gid)); }); }
function prog(gid){ const ts=tasksUnder(gid); if(!ts.length) return 0; return Math.round(ts.filter(t=>t.done).length/ts.length*100); }
function brank(t){ const r=RANK[t.bucket]; return r==null?0:r; }
function fullyDone(t){ if(!t.done) return false; return subsOf(t.id).every(fullyDone); }
function inCol(t,col){ if(col==="done") return !!t.done; if(t.archived) return false; if(col==="today") return brank(t)===4 && !t.done; if(col==="someday") return !fullyDone(t); return brank(t)>=RANK[col]; }
const EDITKEYS="onkeydown=\"if(event.key==='Enter'){event.preventDefault();this.blur();}\" spellcheck=\"false\" contenteditable=\"true\"";

// mutations
function toggleTask(id){ const t=state.tasks.find(x=>x.id===id); if(t){ t.done=!t.done; if(t.done){ t.doneAt=new Date().toISOString(); } else { delete t.doneAt; t.archived=false; } save(); render(); } }
function delTask(id){ const kids=subsOf(id); if(kids.length && !confirm("Delete this task and everything nested under it? You can undo this with Ctrl+Z.")) return; const rm=new Set(); (function col(x){ rm.add(x); subsOf(x).forEach(c=>col(c.id)); })(id); state.tasks=state.tasks.filter(x=>!rm.has(x.id)); save(); render(); }
function renameTask(id,el){ const t=state.tasks.find(x=>x.id===id); const v=el.textContent.trim(); if(t&&v&&t.name!==v){ t.name=v; save(); render(); } else render(); }
function renameGoal(id,el){ const g=goalById(id); const v=el.textContent.trim(); if(g&&v&&g.name!==v){ g.name=v; save(); render(); } else render(); }
function renameHabit(id,el){ const h=state.habits.find(x=>x.id===id); const v=el.textContent.trim(); if(h&&v&&h.name!==v){ h.name=v; save(); render(); } else render(); }
function editGoal(id,f,v){ const g=goalById(id); if(g){ g[f]=v; save(); render(); } }
function editIdentity(id,el){ const g=goalById(id); if(!g) return; let v=el.textContent.trim(); if(v==='…') v=''; if((g.identity||'')!==v){ g.identity=v; save(); render(); } else render(); }
function votesFor(gid){ const tv=state.tasks.filter(x=>{ if(!x.done) return false; const r=rootTaskOf(x.id); const g=r?r.goalId:null; return g && (g===gid||isDescendant(g,gid)); }).length; const hv=state.habits.filter(h=>h.goalId && (h.goalId===gid||isDescendant(h.goalId,gid))).reduce((a,h)=>a+Object.keys(h.done).filter(k=>h.done[k]).length,0); return tv+hv; }
const ASPIRE=[["🔬 Scientist","✍️ Writer","💡 Thinker","🧭 Explorer"],["🎓 Mentor","📚 Scholar","🌱 Grower","🎯 Finisher"],["🏛️ Builder","♟️ Strategist","🔥 Relentless","⚙️ Maker"],["🧠 Curious","🚀 Doer","🪶 Craftsman","🌟 Becoming"]];
function tickerHTML(pid){ const idx=allPillars().indexOf(pid); const words=ASPIRE[(idx<0?0:idx)%ASPIRE.length]; return `<span class="ticker">`+words.map(w=>`<span>${w}</span>`).join("")+`</span>`; }
function dayAspire(pid){ const idx=allPillars().indexOf(pid); const words=ASPIRE[(idx<0?0:idx)%ASPIRE.length]; const dn=Math.floor(Date.now()/86400000); return words[dn%words.length]; }
function addTaskTo(pillarId,el){ const name=el.value.trim(); if(!name) return; state.tasks.push({id:uid(),name,goalId:pillarId,parentId:null,bucket:"someday",done:false}); el.value=""; colState[pillarId+":someday"]=false; localStorage.setItem("myplanner.colstate",JSON.stringify(colState)); save(); render(); }
function addSub(pid,el){ const name=el.value.trim(); if(!name) return; state.tasks.push({id:uid(),name,goalId:null,parentId:pid,bucket:null,done:false}); el.value=""; save(); render(); }
function addPillar(el){ const name=el.value.trim(); if(!name||!isDomain(currentBoard)) return; state.goals.push({id:uid(),name,target:"",parentGoalId:currentBoard}); el.value=""; save(); render(); }
function delPillar(id){ if(!confirm("Delete this pillar and unlink its tasks?")) return; state.goals=state.goals.filter(x=>x.id!==id); state.tasks.forEach(t=>{ if(t.goalId===id) t.goalId=null; }); state.habits.forEach(h=>{ if(h.goalId===id) h.goalId=null; }); save(); render(); }
function addDomain(){ const g={id:uid(),name:"New board",target:"",parentGoalId:null,accent:DOMAIN_PALETTE[domains().length%DOMAIN_PALETTE.length]}; state.goals.push(g); currentBoard=g.id; view="overview"; save(); render(); }
function delDomain(id){ if(domains().length<=1){ alert("You need at least one board."); return; } const g=goalById(id); if(!confirm(`Delete the "${g?g.name:''}" board and all its pillars, plus unlink their tasks? This can't be undone.`)) return; const rm=new Set([id]); let ch=true; while(ch){ ch=false; state.goals.forEach(x=>{ if(x.parentGoalId&&rm.has(x.parentGoalId)&&!rm.has(x.id)){ rm.add(x.id); ch=true; } }); } state.tasks.forEach(t=>{ if(t.goalId&&rm.has(t.goalId)) t.goalId=null; }); state.habits.forEach(h=>{ if(h.goalId&&rm.has(h.goalId)) h.goalId=null; }); state.goals=state.goals.filter(x=>!rm.has(x.id)); currentBoard=null; save(); render(); }
function sweepArchive(){ let n=0; state.tasks.forEach(t=>{ if(t.done && !t.archived){ t.archived=true; n++; } }); if(!n){ alert("Nothing to archive — no newly completed items."); return; } save(); render(); }
function toggleNode(id){ if(texpanded.has(id)) texpanded.delete(id); else texpanded.add(id); render(); }
function isCollapsed(scope,col){ const k=scope+":"+col; if(k in colState) return colState[k]; return DEFAULT_COLLAPSE.includes(col); }
function toggleCol(scope,col){ const k=scope+":"+col; colState[k]=!isCollapsed(scope,col); localStorage.setItem("myplanner.colstate",JSON.stringify(colState)); render(); }

// drag
function dragStart(e,id){ dragId=id; e.dataTransfer.setData("text/plain",id); e.dataTransfer.effectAllowed="move"; e.stopPropagation(); }
function dragOver(e){ e.preventDefault(); e.currentTarget.classList.add("drag"); }
function dragLeave(e){ e.currentTarget.classList.remove("drag"); }
function drop(e,col){ e.preventDefault(); e.currentTarget.classList.remove("drag"); const id=dragId||e.dataTransfer.getData("text/plain"); const t=state.tasks.find(x=>x.id===id); if(t){ if(col==="done"){ if(!t.done){ t.done=true; t.doneAt=new Date().toISOString(); } } else { t.done=false; delete t.doneAt; t.archived=false; t.bucket=col; } save(); render(); } dragId=null; }
function nodeOver(e,id){ if(!dragId||dragId===id) return; e.preventDefault(); e.stopPropagation(); const el=e.currentTarget; const r=el.getBoundingClientRect(); const before=(e.clientY-r.top)<r.height/2; el.classList.toggle("dropbefore",before); el.classList.toggle("dropchild",!before); }
function nodeLeave(e){ e.currentTarget.classList.remove("dropbefore","dropchild"); }
function nodeDrop(e,id){ e.preventDefault(); e.stopPropagation(); const el=e.currentTarget; const before=el.classList.contains("dropbefore"); el.classList.remove("dropbefore","dropchild"); const dg=dragId; dragId=null; if(!dg||dg===id) return; const A=state.tasks.find(x=>x.id===dg), B=state.tasks.find(x=>x.id===id); if(!A||!B) return; const tp= before ? (B.parentId||null) : id; if(tp===dg || (tp && isTaskAncestor(dg,tp))) return; A.parentId=tp; const arr=state.tasks; const a=arr.splice(arr.findIndex(x=>x.id===dg),1)[0]; if(before){ arr.splice(arr.findIndex(x=>x.id===id),0,a); } else { arr.push(a); } save(); render(); }

// popup
function pillarSelectOptions(sel){ return domains().map(d=>`<optgroup label="${esc(d.name)}">`+childrenOf(d.id).map(p=>`<option value="${p.id}"${p.id===sel?' selected':''}>${esc(p.name)}</option>`).join("")+`</optgroup>`).join(""); }
function mSetPillar(gid){ const t=state.tasks.find(x=>x.id===mid); if(t){ t.goalId=gid; save(); render(); } }
function mBlockChange(){ const t=state.tasks.find(x=>x.id===mid); if(!t) return; const sh=document.getElementById('mBSH').value, sm=document.getElementById('mBSM').value, eh=document.getElementById('mBEH').value, em=document.getElementById('mBEM').value; const start=sh+':'+sm; let mins=(+eh*60+ +em)-(+sh*60+ +sm); if(mins<=0) mins=60; t.block={start,mins,date:PD()}; save(); render(); }
function mClearBlock(){ const t=state.tasks.find(x=>x.id===mid); if(t){ delete t.block; save(); render(); openTask(mid); } }
function mToggleMit(c){ const t=state.tasks.find(x=>x.id===mid); if(t){ t.mitDate=c?PD():''; save(); render(); } }
function startTimerFor(id){ if(!id) return; tTaskId=id; tMode="flow"; document.getElementById("tm-pomodoro").classList.remove("active"); document.getElementById("tm-flow").classList.add("active"); document.getElementById("tsettings").style.display="none"; document.getElementById("tpanel").classList.add("open"); populateTTask(); if(!tRunning) timerStartPause(); else timerPaint(); }
function openTask(id){ const t=state.tasks.find(x=>x.id===id); if(!t) return; mid=id; document.getElementById('mName').value=t.name||''; document.getElementById('mDue').value=t.due||''; document.getElementById('mPrio').value=t.prio||''; document.getElementById('mNotes').value=t.notes||''; document.getElementById('mEnergy').value=t.energy||''; document.getElementById('mMit').checked=(t.mitDate===PD()); { const b=(t.block&&t.block.date===PD())?t.block:null; let sh='09',sm='00',eh='10',em='00'; if(b){ const sMin=timeToMin(b.start); sh=String(Math.floor(sMin/60)).padStart(2,'0'); sm=String(sMin%60).padStart(2,'0'); const eMin=sMin+b.mins; eh=String(Math.floor(eMin/60)).padStart(2,'0'); em=String(eMin%60).padStart(2,'0'); } document.getElementById('mBSH').innerHTML=hourOpts(sh); document.getElementById('mBSM').innerHTML=minOpts(sm); document.getElementById('mBEH').innerHTML=hourOpts(eh); document.getElementById('mBEM').innerHTML=minOpts(em); } const pr=document.getElementById('mPillarRow'), ps=document.getElementById('mPillar'); if(t.parentId){ pr.style.display='none'; } else { pr.style.display='block'; ps.innerHTML=pillarSelectOptions(t.goalId); } const mn=(state.sessions||[]).filter(s=>s.taskId===id).reduce((a,s)=>a+s.min,0); document.getElementById('mFocus').textContent = mn? `${Math.floor(mn/60)}h ${mn%60}m focused` : 'none yet'; document.getElementById('modal').style.display='flex'; }
function closeTask(){ document.getElementById('modal').style.display='none'; mid=null; render(); }
function mEdit(f,v){ const t=state.tasks.find(x=>x.id===mid); if(!t) return; t[f]=v; save(); }

// cards + columns
function byId(id){ return state.tasks.find(t=>t.id===id); }

  const now=new Date(T);
  const list = state.habits.length? state.habits.map(h=>{
    const set=new Set(Object.keys(h.done).filter(k=>h.done[k])); const month=[...set].filter(d=>d.startsWith(MONTH)).length; let s=0,d=new Date(T); if(!set.has(fmt(d))) d.setDate(d.getDate()-1); while(set.has(fmt(d))){ s++; d.setDate(d.getDate()-1); }
    const hacc=colorFor(h.goalId); const gl=h.goalId?` · ${esc(goalName(h.goalId))}`:"";
    const cals=[ new Date(now.getFullYear(),now.getMonth()-1,1), new Date(now.getFullYear(),now.getMonth(),1) ].map(f=>habitMonth(h,f,set,hacc)).join("");
    return `<div class="habit"><div class="htop"><div><span class="hname" ${EDITKEYS} onblur="renameHabit('${h.id}',this)">${esc(h.name)}</span> <span class="muted">${h.min} min${gl}</span></div>
      <div class="htop"><span class="streak">${s>0?`${s} day streak`:'—'} · ${month}/${T.getDate()} days this month · ${Math.round(month/Math.max(1,T.getDate())*100)}%</span>
      <select class="gsel" onchange="setHabitGoal('${h.id}',this.value)">${goalOptions(h.goalId)}</select>
      <button class="del" onclick="delHabit('${h.id}')">&times;</button></div></div><div class="hcals">${cals}</div></div>`;
  }).join("") : '<div class="empty">No habits yet.</div>';
  return list+`<div class="addform"><input type="text" id="nhName" placeholder="New habit"><input type="number" id="nhMin" value="30" min="1" style="width:64px"> <span class="muted">min</span><select id="nhGoal">${goalOptions("")}</select><button class="btn" onclick="addHabit()">Add</button></div>`;
}

// habits
function addHabit(){ const n=document.getElementById("nhName").value.trim(); if(!n) return; state.habits.push({id:uid(),name:n,min:+document.getElementById("nhMin").value||30,goalId:document.getElementById("nhGoal").value||null,done:{}}); save(); render(); }
function setHabitGoal(id,gid){ const h=state.habits.find(x=>x.id===id); if(h){ h.goalId=gid||null; save(); render(); } }
function toggleHabit(id,ds){ const h=state.habits.find(x=>x.id===id); if(!h)return; if(h.done[ds]) delete h.done[ds]; else h.done[ds]=true; save(); render(); }
function delHabit(id){ state.habits=state.habits.filter(x=>x.id!==id); save(); render(); }
function allGoalOptions(sel){ let out=""; (function walk(pid,d){ childrenOf(pid).forEach(g=>{ out+=`<option value="${g.id}"${g.id===sel?" selected":""}>${"  ".repeat(d)}${esc(g.name)}</option>`; walk(g.id,d+1); }); })(null,0); return out; }
function goalOptions(sel){ return `<option value="">No goal</option>`+allGoalOptions(sel); }

// nav + render
function setBoard(id){ currentBoard=id; if(isDomain(id)&&(view!=="overview"&&view!=="tasks"&&view!=="deadlines")) view="overview"; render(); }
function setView(v){ view=v; render(); }
function render(){
  const ddb=document.getElementById('dayDoneBtn');
  if(ddb){ const ah=planningAhead(); ddb.textContent = ah ? '\u2190 Back to today' : 'Done for the day'; ddb.classList.toggle('planning',ah); ddb.title = ah ? `Planning ${prettyDate(PD())}. Click to return to today.` : 'Close out today and start planning tomorrow'; }
  const doms=domains();
  if(currentBoard!=="habits" && !isDomain(currentBoard)) currentBoard = doms.length?doms[0].id:"habits";
  const nav=document.getElementById("nav");
  nav.innerHTML = doms.map(d=>{ const a=domainAccent(d.id); const on=currentBoard===d.id; return `<div class="tab ${on?'active':''}" style="--tabc:${a}" onclick="setBoard('${d.id}')">${esc(d.name)}</div>`; }).join("")
    + `<div class="tab" title="Add board" onclick="addDomain()">+</div>`
    + `<div class="tab ${currentBoard==='habits'?'active':''}" style="--tabc:var(--ink)" onclick="setBoard('habits')">Habits</div>`;
  const c=document.getElementById("content");
  if(currentBoard==="habits"){ c.innerHTML=habitsHTML(); return; }
  const dom=goalById(currentBoard);
  const subtabs=`<div class="dtabs">`+[["overview","Overview"],["tasks","Tasks"],["deadlines","Deadlines"],["calendar","Calendar"],["insights","Insights"]].map(([v,l])=>`<button class="dtab ${view===v?'active':''}" onclick="setView('${v}')">${l}</button>`).join("")+`</div>`;
  let body=""; if(view==="tasks") body=domainTasksHTML(dom); else if(view==="deadlines") body=deadlinesHTML(dom); else if(view==="calendar") body=calendarHTML(); else if(view==="insights") body=insightsHTML(dom); else body=overviewHTML(dom);
  c.innerHTML=subtabs+body;
}

// tools
function exportData(){ const b=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="lodestar-backup-"+TS+".json"; a.click(); }
function importData(inp){ const f=inp.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(d.tasks&&d.goals&&d.habits){ state=d; currentBoard=null; save(); render(); alert("Imported."); } else alert("Not a Lodestar backup."); }catch(e){ alert("Could not read that file."); } }; r.readAsText(f); inp.value=""; }
function resetData(){ if(!confirm("⚠ WARNING\n\nThis ERASES everything and gives you a blank planner.\n\nA backup will download first. This cannot be undone otherwise.\n\nContinue?")) return; exportData(); setTimeout(()=>{ if(confirm("Backup downloaded. Proceed with the reset now?")){ state=blank(); currentBoard=null; texpanded=new Set(); save(); render(); } }, 400); }

// focus timer (wall-clock based so background tabs never undercount)
let tMode="pomodoro", tRunning=false, tPhase="work", tRemain=1500, tTick=null, tTaskId="", tWork=25, tBreak=5, tEnd=0, tFlowBase=0, tRunStart=0;
const TCIRC=2*Math.PI*52;
function tLabel(t){ if(t.parentId){ const p=byId(t.parentId); return (p?p.name+" › ":"")+t.name; } return t.name; }
function populateTTask(){ const s=document.getElementById("ttask"); s.innerHTML=`<option value="">— no task —</option>`+state.tasks.map(t=>`<option value="${t.id}"${t.id===tTaskId?" selected":""}>${esc(tLabel(t))}</option>`).join(""); s.onchange=function(){ tTaskId=this.value; }; }
function timerToggle(){ const p=document.getElementById("tpanel"); const open=p.classList.toggle("open"); if(open){ populateTTask(); timerPaint(); } }
function timerMode(m){ if(tRunning) return; tMode=m; document.getElementById("tm-pomodoro").classList.toggle("active",m==="pomodoro"); document.getElementById("tm-flow").classList.toggle("active",m==="flow"); document.getElementById("tsettings").style.display=m==="pomodoro"?"flex":"none"; if(m==="pomodoro"){ tPhase="work"; tRemain=tWork*60; } else { tFlowBase=0; } timerPaint(); }
function fmtT(sec){ sec=Math.max(0,Math.floor(sec)); const m=Math.floor(sec/60), s=sec%60; return String(m).padStart(2,'0')+":"+String(s).padStart(2,'0'); }
function pomoSec(){ return tRunning? Math.max(0,Math.round((tEnd-Date.now())/1000)) : tRemain; }
function flowSec(){ return tFlowBase + (tRunning? (Date.now()-tRunStart)/1000 : 0); }
function timerPaint(){
  const disp=document.getElementById("ttime"); if(!disp) return;
  const ph=document.getElementById("tphase"), prog=document.getElementById("tprog"), pill=document.getElementById("tpillt"), pillw=document.getElementById("tpill"), btn=document.getElementById("tstart"), b2=document.getElementById("tsecond");
  let sec;
  if(tMode==="pomodoro"){ sec=pomoSec(); const tot=(tPhase==="work"?tWork:tBreak)*60; const frac=tot?sec/tot:0; ph.textContent=tPhase; prog.style.display=""; prog.setAttribute("stroke-dasharray",TCIRC); prog.setAttribute("stroke-dashoffset",(TCIRC*(1-frac)).toFixed(1)); }
  else { sec=flowSec(); ph.textContent="flow"; prog.style.display="none"; }
  disp.textContent=fmtT(sec);
  btn.textContent=tRunning?"Pause":"Start"; b2.textContent=tMode==="flow"?"Finish":"Reset";
  if(pill) pill.textContent=tRunning?fmtT(sec):"Focus"; if(pillw) pillw.classList.toggle("run",tRunning);
  const tot=(state.sessions||[]).filter(s=>s.date===TS).reduce((a,s)=>a+s.min,0);
  document.getElementById("ttotal").textContent = tot? `${Math.floor(tot/60)?Math.floor(tot/60)+"h ":""}${tot%60}m focused today` : "No focus logged today";
}
function timerStartPause(){
  if(tRunning){ if(tMode==="pomodoro") tRemain=pomoSec(); else tFlowBase=flowSec(); tRunning=false; clearInterval(tTick); timerPaint(); return; }
  tWork=+document.getElementById("twork").value||25; tBreak=+document.getElementById("tbreak").value||5;
  if(tMode==="pomodoro"){ if(tRemain<=0){ tPhase="work"; tRemain=tWork*60; } tEnd=Date.now()+tRemain*1000; } else { tRunStart=Date.now(); }
  tRunning=true; tTick=setInterval(timerStep,1000); timerPaint();
}
function timerStep(){ if(tMode==="pomodoro" && pomoSec()<=0){ timerDone(); } timerPaint(); }
function timerDone(){ beep(); flashPanel(); if(tPhase==="work"){ logFocus(tWork); tPhase="break"; tRemain=tBreak*60; tEnd=Date.now()+tRemain*1000; } else { tPhase="work"; tRemain=tWork*60; tRunning=false; clearInterval(tTick); } }
function timerSecond(){ if(tMode==="flow"){ const sec=flowSec(); if(sec>=60) logFocus(Math.round(sec/60)); tRunning=false; clearInterval(tTick); tFlowBase=0; timerPaint(); } else { tRunning=false; clearInterval(tTick); tPhase="work"; tRemain=tWork*60; timerPaint(); } }
function logFocus(min){ if(min<=0) return; if(!state.sessions) state.sessions=[]; state.sessions.push({taskId:tTaskId||null,min:Math.round(min),date:TS,mode:tMode}); save(); }
function flashPanel(){ const p=document.getElementById("tpanel"); p.classList.add("tflash"); setTimeout(()=>p.classList.remove("tflash"),650); }
function beep(){ try{ const A=window.AudioContext||window.webkitAudioContext; const a=new A(); const o=a.createOscillator(), g=a.createGain(); o.connect(g); g.connect(a.destination); o.type="sine"; o.frequency.value=680; g.gain.setValueAtTime(0.0001,a.currentTime); g.gain.exponentialRampToValueAtTime(0.18,a.currentTime+0.03); g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+0.6); o.start(); o.stop(a.currentTime+0.6);}catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) timerPaint(); });

function openInbox(){ renderInbox(); document.getElementById('inbox').style.display='flex'; const c=document.getElementById('capIn'); if(c&&c.focus) setTimeout(()=>c.focus(),0); }
function closeInbox(){ document.getElementById('inbox').style.display='none'; }
function addCapture(){ const el=document.getElementById('capIn'); const v=(el.value||'').trim(); if(!v) return; if(!state.inbox) state.inbox=[]; state.inbox.push({id:uid(),text:v}); el.value=''; save(); renderInbox(); updateInboxBadge(); }
function delCapture(id){ state.inbox=(state.inbox||[]).filter(x=>x.id!==id); save(); renderInbox(); updateInboxBadge(); }
function inboxToTask(id){ const sel=document.getElementById('ib_'+id); const pid=sel&&sel.value; const item=(state.inbox||[]).find(x=>x.id===id); if(!item) return; if(!pid){ alert('Pick a pillar for this idea first.'); return; } state.tasks.push({id:uid(),name:item.text,goalId:pid,parentId:null,bucket:'someday',done:false}); state.inbox=state.inbox.filter(x=>x.id!==id); save(); renderInbox(); updateInboxBadge(); render(); }
function renderInbox(){ const list=document.getElementById('inboxList'); const items=state.inbox||[]; list.innerHTML= items.length? items.map(it=>`<div class="ibrow"><span class="ibtext">${esc(it.text)}</span><select id="ib_${it.id}"><option value="">→ pillar…</option>${pillarSelectOptions('')}</select><button class="btn" style="padding:4px 9px;font-size:12px" onclick="inboxToTask('${it.id}')">Add</button><button class="del" onclick="delCapture('${it.id}')">&times;</button></div>`).join('') : '<div class="muted">Nothing captured. Jot ideas above; sort them into pillars whenever.</div>'; }
function updateInboxBadge(){ const b=document.getElementById('inboxBtn'); if(b){ const n=(state.inbox||[]).length; b.textContent='Inbox'+(n?` (${n})`:''); } }
function openJournal(){ document.getElementById('jText').value=(state.journal&&state.journal[TS])||''; document.getElementById('jDate').textContent=TS; document.getElementById('journal').style.display='flex'; }
function closeJournal(){ document.getElementById('journal').style.display='none'; }
function jEdit(v){ if(!state.journal) state.journal={}; state.journal[TS]=v; save(); }
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ closeTask(); closeInbox(); closeJournal(); return; } const tag=((e.target&&e.target.tagName)||"").toLowerCase(); if(tag==="input"||tag==="textarea"||tag==="select"||(e.target&&e.target.isContentEditable)) return; if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){ e.preventDefault(); e.shiftKey?redo():undo(); } else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="y"){ e.preventDefault(); redo(); } });
const EXP_H=17, EXP_M=15;
function checkSchedule(){ const now=new Date(); const todayKey=fmt(now); const past=now.getHours()>EXP_H||(now.getHours()===EXP_H&&now.getMinutes()>=EXP_M); if(past && localStorage.getItem("myplanner.lastreminder")!==todayKey){ localStorage.setItem("myplanner.lastreminder",todayKey); const r=document.getElementById("reminder"); if(r) r.classList.add("show"); } }
load();
if(state.planDate && state.planDate<=fmt(today())) delete state.planDate;
history=[JSON.stringify(state)]; hi=0;
themeName=localStorage.getItem("myplanner.theme")||"dark"; applyThemeVars(themeName);
render();
{ const _b=document.getElementById("themeBtn"); if(_b) _b.textContent = themeName==="dark"?"☾":"☀"; }
updateInboxBadge();
checkSchedule();
setInterval(checkSchedule, 60000);
setInterval(checkRollover, 30000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) checkRollover(); });
</script>
